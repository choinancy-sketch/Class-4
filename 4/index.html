<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Currency Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl border border-slate-100 p-6 md:p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Live Currency Exchange</h1>
            <p class="text-slate-500 text-sm mt-1">Powered by ExchangeRate API (Base: USD)</p>
        </div>

        <!-- Status Message Box -->
        <div id="statusMessage" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- Converter Form -->
        <div class="space-y-4">
            <!-- Amount Input -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Amount</label>
                <input type="number" id="amountInput" value="1" min="0" step="any" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg font-semibold text-slate-800">
            </div>

            <!-- Currency Selection Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">From Currency</label>
                    <select id="fromCurrency" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-800 font-medium">
                        <option value="USD">USD - US Dollar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">To Currency</label>
                    <select id="toCurrency" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-slate-800 font-medium">
                        <option value="EUR">EUR - Euro</option>
                    </select>
                </div>
            </div>

            <!-- Swap Button -->
            <div class="flex justify-center my-2">
                <button id="swapBtn" class="p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition duration-200" title="Swap Currencies">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                    </svg>
                </button>
            </div>

            <!-- Result Display -->
            <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 text-center mt-4">
                <p class="text-xs uppercase tracking-wider text-blue-600 font-semibold">Converted Amount</p>
                <div id="conversionResult" class="text-3xl md:text-4xl font-extrabold text-blue-900 mt-2">
                    --
                </div>
                <p id="exchangeRateDetails" class="text-sm text-blue-700 mt-1"></p>
            </div>
        </div>

        <!-- Footer / Last Updated -->
        <div class="mt-6 text-center text-xs text-slate-400">
            <span id="lastUpdated">Loading exchange rates...</span>
        </div>
    </div>

    <script>
        <!-- Student Work -->
        const API_URL =  ;
        
        let exchangeData = null;

        const amountInput = document.getElementById('amountInput');
        const fromCurrencySelect = document.getElementById('fromCurrency');
        const toCurrencySelect = document.getElementById('toCurrency');
        const swapBtn = document.getElementById('swapBtn');
        const conversionResult = document.getElementById('conversionResult');
        const exchangeRateDetails = document.getElementById('exchangeRateDetails');
        const lastUpdated = document.getElementById('lastUpdated');
        const statusMessage = document.getElementById('statusMessage');

        function showMessage(text, isError = false) {
            statusMessage.textContent = text;
            statusMessage.className = `mb-4 p-3 rounded-lg text-sm text-center ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            statusMessage.classList.remove('hidden');
        }

        async function fetchExchangeRates() {
            try {
                showMessage('Fetching live rates from API...', false);
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch rates');
                
                const data = await response.json();
                if (data.result === 'success') {
                    exchangeData = data;
                    populateDropdowns(Object.keys(data.conversion_rates));
                    updateConversion();
                    
                    const updateDate = data.time_last_update_utc ? new Date(data.time_last_update_utc).toLocaleString() : 'Just now';
                    lastUpdated.textContent = `Last updated: ${updateDate}`;
                    statusMessage.classList.add('hidden');
                } else {
                    throw new Error('API returned unsuccessful result');
                }
            } catch (error) {
                console.error(error);
                showMessage('Could not connect to exchange rate service. Please check your internet connection.', true);
            }
        }

        function populateDropdowns(currencies) {
            fromCurrencySelect.innerHTML = '';
            toCurrencySelect.innerHTML = '';

            currencies.forEach(currency => {
                const option1 = document.createElement('option');
                option1.value = currency;
                option1.textContent = currency;
                fromCurrencySelect.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = currency;
                option2.textContent = currency;
                toCurrencySelect.appendChild(option2);
            });

            // Set sensible defaults
            fromCurrencySelect.value = 'USD';
            toCurrencySelect.value = 'EUR';
        }

        function updateConversion() {
            if (!exchangeData) return;

            const amount = parseFloat(amountInput.value) || 0;
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;

            const rates = exchangeData.conversion_rates;
            
            // Rates are base USD. Convert amount to USD first, then to target currency
            const amountInUSD = amount / rates[fromCurrency];
            const convertedAmount = amountInUSD * rates[toCurrency];

            const singleRate = rates[toCurrency] / rates[fromCurrency];

            conversionResult.textContent = `${convertedAmount.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 })} ${toCurrency}`;
            exchangeRateDetails.textContent = `1 ${fromCurrency} = ${singleRate.toFixed(4)} ${toCurrency}`;
        }

        // Event Listeners
        amountInput.addEventListener('input', updateConversion);
        fromCurrencySelect.addEventListener('change', updateConversion);
        toCurrencySelect.addEventListener('change', updateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromCurrencySelect.value;
            fromCurrencySelect.value = toCurrencySelect.value;
            toCurrencySelect.value = temp;
            updateConversion();
        });

        // Initialize on load
        window.onload = () => {
            fetchExchangeRates();
        };
    </script>
</body>
</html>
