<!DOCTYPE html>
<html>
<head>
    <title>Transaction Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Arial; max-width: 800px; margin: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2c3e50; color: white; padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .credit { color: #27ae60; font-weight: bold; }
        .debit { color: #e74c3c; font-weight: bold; }
        .balance { font-size: 28px; color: #2c3e50; }
        input, select { padding: 8px; margin: 5px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>💰 Transaction Tracker</h1>
    <div class="balance">Balance: $<span id="balance">4,250.75</span></div>
    
    <h3>Add Transaction</h3>
    <input type="date" id="date">
    <input type="text" id="desc" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount" step="0.01">
    <select id="type">
        <option value="debit">Expense (Debit)</option>
        <option value="credit">Income (Credit)</option>
    </select>
    <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Income">Income</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
    </select>
    <button onclick="addTransaction()">Add</button>
    
    <h3>Filter by Category</h3>
    <select id="filter" onchange="filterTransactions()">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Income">Income</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
    </select>
    
    <table>
        <thead>
            <tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr>
        </thead>
        <tbody id="transactions"></tbody>
    </table>

    <script>
        let transactions = [
            {date: '2025-01-15', desc: 'Grocery Store', category: 'Food', amount: -85.50, type: 'debit'},
            {date: '2025-01-14', desc: 'Salary Deposit', category: 'Income', amount: 3200, type: 'credit'},
            {date: '2025-01-13', desc: 'Gas Station', category: 'Transport', amount: -45.00, type: 'debit'},
            {date: '2025-01-12', desc: 'Online Shopping', category: 'Shopping', amount: -129.99, type: 'debit'},
            {date: '2025-01-11', desc: 'Electric Bill', category: 'Bills', amount: -95.00, type: 'debit'}
        ];
        
        function renderTransactions(data) {
            const tbody = document.getElementById('transactions');
            tbody.innerHTML = data.map(t => `
                <tr>
                    <td>${t.date}</td>
                    <td>${t.desc}</td>
                    <td>${t.category}</td>
                    <td class="${t.type}">${t.type === 'credit' ? '+' : ''}$${Math.abs(t.amount).toFixed(2)}</td>
                </tr>
            `).join('');
        }
        
        function addTransaction() {
            const t = {
                date: document.getElementById('date').value,
                desc: document.getElementById('desc').value,
                amount: document.getElementById('type').value === 'debit' ? 
                    -Math.abs(parseFloat(document.getElementById('amount').value)) :
                    Math.abs(parseFloat(document.getElementById('amount').value)),
                type: document.getElementById('type').value,
                category: document.getElementById('category').value
            };
            transactions.unshift(t);
            renderTransactions(transactions);
        }
        
        function filterTransactions() {
            const filter = document.getElementById('filter').value;
            const filtered = filter === 'All' ? transactions : transactions.filter(t => t.category === filter);
            renderTransactions(filtered);
        }
        
        renderTransactions(transactions);
    </script>
</body>
</html>
