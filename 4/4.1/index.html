<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 50px auto; }
        input, select, button { padding: 10px; margin: 5px; font-size: 16px; }
        #result { font-size: 24px; color: green; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>💱 Currency Converter</h1>
    <input type="number" id="amount" placeholder="Enter amount" value="100">
    <select id="fromCurrency">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
    </select>
    <span>→</span>
    <select id="toCurrency">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="JPY">JPY</option>
    </select>
    <button onclick="convert()">Convert</button>
    <div id="result"></div>

    <script>
        async function convert() {
            const amount = document.getElementById('amount').value;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            
            const response = await fetch(
                `https://v6.exchangerate-api.com/v6/YOUR_API_KEY/pair/${from}/${to}/${amount}`
            );
            const data = await response.json();
            
            document.getElementById('result').innerText = 
                `${amount} ${from} = ${data.conversion_result.toFixed(2)} ${to}`;
        }
    </script>
</body>
</html>
